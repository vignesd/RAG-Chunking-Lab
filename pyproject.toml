[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chunking-lab"
version = "0.1.0"
description = "Explore and compare text chunking strategies for RAG pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
]

[tool.setuptools.packages.find]
where = ["src"]
